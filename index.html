<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel CCTV · Investigaciones · PPS IKEA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --azul:#0058A3; --azul-osc:#003D73; --amarillo:#FFDA1A;
    --gris-fondo:#EEF1F4; --gris-borde:#DCE1E6; --texto:#111820;
    --verde:#2E8B3D; --verde-bg:#E6F4EA;
    --rojo:#C0392B; --rojo-bg:#FBEAE8;
    --naranja:#E08A00;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--gris-fondo);color:var(--texto);}
  header{
    background:var(--azul);color:#fff;padding:16px 24px;display:flex;align-items:center;
    justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header .left{display:flex;align-items:center;gap:12px;}
  .logo-pps{width:50px;height:50px;flex-shrink:0;background:#fff;border-radius:10px;padding:3px;object-fit:contain;box-shadow:0 1px 4px rgba(0,0,0,.15);}
  header h1{font-size:18px;margin:0;}
  header p{margin:0;font-size:12px;opacity:.85;}
  .clock{font-size:13px;background:rgba(255,255,255,.15);padding:6px 12px;border-radius:8px;}

  .summary{display:flex;gap:14px;padding:16px 24px 0;flex-wrap:wrap;}
  .sum-card{
    flex:1;min-width:130px;background:#fff;border-radius:12px;padding:14px 16px;
    border:1px solid var(--gris-borde);text-align:center;
  }
  .sum-card .n{font-size:26px;font-weight:800;color:var(--azul-osc);}
  .sum-card .l{font-size:11.5px;color:#6b7680;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .sum-card.pend .n{color:#5b6670;}
  .sum-card.proc .n{color:var(--naranja);}
  .sum-card.ident .n{color:var(--verde);}
  .sum-card.noident .n{color:var(--rojo);}

  .tabs{display:flex;gap:8px;padding:18px 24px 0;flex-wrap:wrap;}
  .tab{
    padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;
    background:#fff;border:1.5px solid var(--gris-borde);color:#5b6670;
  }
  .tab.active{background:var(--azul);color:#fff;border-color:var(--azul);}

  .toolbar{padding:12px 24px 0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  .toolbar input{padding:9px 12px;border-radius:8px;border:1.5px solid var(--gris-borde);font-size:13px;width:240px;}
  .toolbar button{background:#fff;border:1.5px solid var(--gris-borde);border-radius:8px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--azul);}

  .grid{padding:14px 24px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;}

  .card{
    background:#fff;border-radius:14px;border:1px solid var(--gris-borde);overflow:hidden;
    box-shadow:0 1px 3px rgba(0,0,0,.05);display:flex;flex-direction:column;
  }
  .card-top{padding:14px 16px 10px;border-left:7px solid #9aa4ad;}
  .card.pendiente .card-top{border-left-color:#9aa4ad;}
  .card.enproceso .card-top{border-left-color:var(--amarillo);background:#FFFCF0;}
  .card.identificado .card-top{border-left-color:var(--verde);background:var(--verde-bg);}
  .card.noidentificado .card-top{border-left-color:var(--rojo);background:var(--rojo-bg);}

  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .area{font-size:15px;font-weight:800;color:var(--azul-osc);}
  .solicitante{font-size:12px;color:#6b7680;margin-top:2px;}
  .estado-tag{font-size:11px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap;}
  .estado-tag.pendiente{background:#E7EAED;color:#5b6670;}
  .estado-tag.enproceso{background:var(--amarillo);color:var(--azul-osc);}
  .estado-tag.identificado{background:var(--verde);color:#fff;}
  .estado-tag.noidentificado{background:var(--rojo);color:#fff;}

  .crit-tag{display:inline-block;margin-top:8px;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;}
  .crit-Alta{background:var(--rojo-bg);color:var(--rojo);}
  .crit-Media{background:#FCEFDC;color:var(--naranja);}
  .crit-Baja{background:var(--verde-bg);color:var(--verde);}

  .detalle{font-size:13.5px;color:#222;padding:10px 16px;line-height:1.4;border-top:1px solid #F0F2F4;}

  .meta{padding:0 16px 12px;display:flex;flex-wrap:wrap;gap:10px 16px;font-size:11.5px;color:#6b7680;}
  .meta b{color:#333;}

  .timer-box{
    margin:0 16px 12px;padding:10px 12px;border-radius:9px;background:#F7F8FA;
    display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;
  }
  .timer-box .t{font-family:'Courier New',monospace;font-size:15px;color:var(--azul-osc);}
  .card.enproceso .timer-box{background:#FFF7DB;}
  .card.identificado .timer-box{background:var(--verde-bg);}
  .card.noidentificado .timer-box{background:var(--rojo-bg);}

  .actions{padding:12px 16px 16px;display:flex;gap:8px;border-top:1px solid #F0F2F4;}
  .actions button{
    flex:1;padding:11px 8px;border-radius:9px;border:none;font-weight:800;font-size:13px;cursor:pointer;
  }
  .btn-aceptar{background:var(--azul);color:#fff;}
  .btn-ident{background:var(--verde);color:#fff;}
  .btn-noident{background:var(--rojo);color:#fff;}
  .actions button:active{transform:scale(.97);}

  .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:#8b94a0;font-size:14px;}

  .updated{padding:0 24px 20px;font-size:11.5px;color:#8b94a0;text-align:right;}
</style>
</head>

<div class="summary">
  <div class="sum-card pend"><div class="n" id="cPend">0</div><div class="l">Pendientes</div></div>
  <div class="sum-card proc"><div class="n" id="cProc">0</div><div class="l">En proceso</div></div>
  <div class="sum-card ident"><div class="n" id="cIdent">0</div><div class="l">Identificadas</div></div>

<div class="tabs">
  <div class="tab active" data-f="activas" onclick="setFiltro('activas')">🟡 En curso (pendientes + proceso)</div>
  <div class="tab" data-f="pendiente" onclick="setFiltro('pendiente')">Pendientes</div>
  <div class="tab" data-f="enproceso" onclick="setFiltro('enproceso')">En proceso</div>
  <div class="tab" data-f="resueltas" onclick="setFiltro('resueltas')">Resueltas</div>
  <div class="tab" data-f="todas" onclick="setFiltro('todas')">Todas</div>
</div>

<div class="toolbar">
  <input type="text" id="buscador" placeholder="🔎 Buscar por área, solicitante o SKU/OLPN…" oninput="render()">
  <div style="display:flex;gap:8px;flex-wrap:wrap;">
    <button onclick="cargarDatos()">⟳ Actualizar ahora</button>
    <button onclick="descargarExcel()">⬇ Descargar Excel</button>
    <button onclick="abrirGoogleSheet()">📄 Abrir Google Sheet</button>
  </div>
</div>

<div class="grid" id="grid"><div class="empty">Cargando investigaciones…</div></div>
<div class="updated" id="updated"></div>

<script>
/* ====== CONFIGURACIÓN ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbynLOdutFeD1JOXuHVe7O-2cUlKDd9aFKGl9SY3GzuEhO53HBdfFwXtniikOtnRi5g/exec';
const CCTV_RESPONSABLE = ''; // opcional: nombre de quien opera este panel
// Pega aquí el link para compartir de tu Google Sheet (el mismo que usa el Apps Script)
// Ej: 'https://docs.google.com/spreadsheets/d/TU_ID_DE_HOJA/edit'
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbynLOdutFeD1JOXuHVe7O-2cUlKDd9aFKGl9SY3GzuEhO53HBdfFwXtniikOtnRi5g/exec';

let datos = [];
let filtro = 'activas';

function setFiltro(f){
  filtro = f;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.f===f));
  render();
}

function cargarDatos(){
  const cb = 'cb_' + Date.now();
  window[cb] = function(res){
    datos = res.data || [];
    render();
    document.getElementById('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-CL');
    delete window[cb];
  };
  const script = document.createElement('script');
  script.src = API_URL + '?action=list&callback=' + cb;
  script.onerror = ()=>{ document.getElementById('grid').innerHTML = '<div class="empty">No se pudo conectar. Revisa la URL de Apps Script o tu conexión.</div>'; };
  document.body.appendChild(script);
  setTimeout(()=>script.remove(), 8000);
}

function estadoInfo(r){
  if(r.Estado === 'Pendiente') return {cls:'pendiente', tag:'Pendiente'};
  if(r.Estado === 'En Proceso') return {cls:'enproceso', tag:'En proceso'};
  if(r.Estado === 'Resuelto' && r.Resultado === 'Identificado') return {cls:'identificado', tag:'Identificado ✓'};
  if(r.Estado === 'Resuelto' && r.Resultado === 'No Identificado') return {cls:'noidentificado', tag:'No identificado ✕'};
  return {cls:'pendiente', tag:r.Estado};
}

function fmtDuracion(ms){
  if(ms < 0) ms = 0;
  const totalSeg = Math.floor(ms/1000);
  const h = Math.floor(totalSeg/3600);
  const m = Math.floor((totalSeg%3600)/60);
  const s = totalSeg%60;
  return [h,m,s].map(n=>String(n).padStart(2,'0')).join(':');
}

function render(){
  const q = document.getElementById('buscador').value.trim().toLowerCase();
  let filtrados = datos.filter(r=>{
    if(filtro==='pendiente' && r.Estado!=='Pendiente') return false;
    if(filtro==='enproceso' && r.Estado!=='En Proceso') return false;
    if(filtro==='resueltas' && r.Estado!=='Resuelto') return false;
    if(filtro==='activas' && r.Estado==='Resuelto') return false;
    if(q){
      const blob = (r.Area+' '+r.Solicitante+' '+r.Detalle).toLowerCase();
      if(!blob.includes(q)) return false;
    }
    return true;
  });

  // Contadores globales (no afectados por filtro de texto)
  document.getElementById('cPend').textContent = datos.filter(r=>r.Estado==='Pendiente').length;
  document.getElementById('cProc').textContent = datos.filter(r=>r.Estado==='En Proceso').length;
  document.getElementById('cIdent').textContent = datos.filter(r=>r.Estado==='Resuelto' && r.Resultado==='Identificado').length;
  document.getElementById('cNoIdent').textContent = datos.filter(r=>r.Estado==='Resuelto' && r.Resultado==='No Identificado').length;

  const grid = document.getElementById('grid');
  if(!filtrados.length){
    grid.innerHTML = '<div class="empty">No hay investigaciones en esta vista.</div>';
    return;
  }

  // Orden: críticas primero dentro de pendientes/en proceso, luego por fecha
  const pesoCrit = {Alta:0, Media:1, Baja:2};
  filtrados.sort((a,b)=>{
    if(a.Estado!==b.Estado){
      const ordenEstado = {'Pendiente':0,'En Proceso':1,'Resuelto':2};
      return ordenEstado[a.Estado]-ordenEstado[b.Estado];
    }
    const pc = (pesoCrit[a.Criticidad]??3)-(pesoCrit[b.Criticidad]??3);
    if(pc!==0) return pc;
    return new Date(b.Timestamp)-new Date(a.Timestamp);
  });

  grid.innerHTML = filtrados.map(r=>{
    const e = estadoInfo(r);
    const fSol = new Date(r.Timestamp);
    const horaSol = fSol.toLocaleString('es-CL',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});

    let timerHtml = '';
    if(r.Estado==='Pendiente'){
      timerHtml = `<div class="timer-box"><span>⏳ Esperando aceptación</span><span class="t" data-since="${fSol.getTime()}">00:00:00</span></div>`;
    } else if(r.Estado==='En Proceso'){
      const since = new Date(r.HoraAceptacion).getTime();
      timerHtml = `<div class="timer-box"><span>🟡 En investigación</span><span class="t live" data-since="${since}">00:00:00</span></div>`;
    } else if(r.Estado==='Resuelto'){
      const ini = new Date(r.HoraAceptacion).getTime();
      const fin = new Date(r.HoraFinalizacion).getTime();
      timerHtml = `<div class="timer-box"><span>✅ Tiempo total investigación</span><span class="t">${fmtDuracion(fin-ini)}</span></div>`;
    }

    let actionsHtml = '';
    if(r.Estado==='Pendiente'){
      actionsHtml = `<div class="actions"><button class="btn-aceptar" onclick="aceptar('${r.ID}')">✅ Aceptar investigación</button></div>`;
    } else if(r.Estado==='En Proceso'){
      actionsHtml = `<div class="actions">
        <button class="btn-ident" onclick="resolver('${r.ID}','Identificado')">✔ Identificado</button>
        <button class="btn-noident" onclick="resolver('${r.ID}','No Identificado')">✕ No identificado</button>
      </div>`;
    }

    return `
    <div class="card ${e.cls}">
      <div class="card-top">
        <div class="row1">
          <div>
            <div class="area">${r.Area}</div>
            <div class="solicitante">Solicita: ${r.Solicitante}</div>
          </div>
          <div class="estado-tag ${e.cls}">${e.tag}</div>
        </div>
        <span class="crit-tag crit-${r.Criticidad}">Criticidad ${r.Criticidad}</span>
      </div>
      <div class="detalle">${(r.Detalle||'').replace(/</g,'&lt;')}</div>
      <div class="meta">
        <span>🕒 Solicitado: <b>${horaSol}</b></span>
        <span>⏱ SLA objetivo: <b>${r.TiempoRespuesta}</b></span>
        ${r.ResponsableCCTV ? `<span>🎥 CCTV: <b>${r.ResponsableCCTV}</b></span>` : ''}
      </div>
      ${timerHtml}
      ${actionsHtml}
    </div>`;
  }).join('');
}

function abrirGoogleSheet(){
  if(!SHEET_URL || SHEET_URL.indexOf('https://script.google.com/macros/s/AKfycbynLOdutFeD1JOXuHVe7O-2cUlKDd9aFKGl9SY3GzuEhO53HBdfFwXtniikOtnRi5g/exec') === 0){
    alert('Falta configurar SHEET_URL en el código con el link de tu Google Sheet.');
    return;
  }
  window.open(SHEET_URL, '_blank');
}

function descargarExcel(){
  if(typeof XLSX === 'undefined'){
    alert('No se pudo cargar la librería de Excel. Revisa tu conexión a internet.');
    return;
  }
  if(!datos.length){
    alert('No hay datos para descargar.');
    return;
  }
  const filas = datos.map(r => ({
    'ID': r.ID,
    'Fecha/Hora solicitud': r.Timestamp ? new Date(r.Timestamp).toLocaleString('es-CL') : '',
    'Área solicitante': r.Area,
    'Solicitante': r.Solicitante,
    'Criticidad': r.Criticidad,
    'Tiempo de respuesta (SLA)': r.TiempoRespuesta,
    'SKU / OLPN / Descripción': r.Detalle,
    'Estado': r.Estado,
    'Hora aceptación CCTV': r.HoraAceptacion ? new Date(r.HoraAceptacion).toLocaleString('es-CL') : '',
    'Responsable CCTV': r.ResponsableCCTV,
    'Hora finalización': r.HoraFinalizacion ? new Date(r.HoraFinalizacion).toLocaleString('es-CL') : '',
    'Resultado': r.Resultado
  }));
  const ws = XLSX.utils.json_to_sheet(filas);
  ws['!cols'] = [
    {wch:16},{wch:18},{wch:18},{wch:20},{wch:11},{wch:16},{wch:40},{wch:12},{wch:18},{wch:16},{wch:18},{wch:16}
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Investigaciones CCTV');
  const fecha = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `Investigaciones_CCTV_${fecha}.xlsx`);
}

function aceptar(id){
  const fd = new FormData();
  fd.append('action','accept');
  fd.append('id', id);
  fd.append('responsable', CCTV_RESPONSABLE);
  fetch(API_URL, {method:'POST', body:fd, mode:'no-cors'}).then(()=> setTimeout(cargarDatos, 500));
}
function resolver(id, resultado){
  const fd = new FormData();
  fd.append('action','resolve');
  fd.append('id', id);
  fd.append('resultado', resultado);
  fetch(API_URL, {method:'POST', body:fd, mode:'no-cors'}).then(()=> setTimeout(cargarDatos, 500));
}

// Reloj y cronómetros en vivo
setInterval(()=>{
  document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-CL');
  document.querySelectorAll('.t[data-since]').forEach(el=>{
    const since = Number(el.dataset.since);
    el.textContent = fmtDuracion(Date.now()-since);
  });
}, 1000);

// Autorefresco de datos cada 20s
cargarDatos();
setInterval(cargarDatos, 20000);
</script>
